<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant ordering app</title>
    <link href="css/styles.css" rel="stylesheet"/>
</head>
<body>
    <header>
        <h1>Jimmy's Diner</h1>
    </header>
    <div>
        <p>The best burgers and pizzas in town!</p>
    </div>
    <main>
        <section class="pizza-section">
            <h3>🍕Pizza</h3>
            <p>Pepperoni, mushrooms, mozzarella</p>
            <span>$14</span>
            <button>+</button>
        </section>
        <section class="burger-section">
            <h3>🍔 Hamburger</h3>
            <p>beef, cheese, lettuce</p>
            <span>$12</span>
            <button>+</button>
        </section>
        <section class="beer-section">
            <h3>🍺 Beer</h3>
            <p>grain, hops, yeast, water</p>
            <span>$12</span>
            <button>+</button>
        </section>
    </main>
</body>
</html>
